<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>EHWA Q.A Barcode</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f4f8;overscroll-behavior:none;}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,0.12);}
.hero{position:relative;background:linear-gradient(145deg,#0a2e6e 0%,#1255b5 45%,#1976d2 70%,#64b5f6 100%);padding:28px 20px 30px;text-align:center;overflow:hidden;flex-shrink:0;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 75% 25%,rgba(255,255,255,0.18) 0%,transparent 55%);}
.cloud{position:absolute;background:rgba(255,255,255,0.15);border-radius:60px;}
.cloud1{width:130px;height:32px;top:18%;left:-15px;filter:blur(6px);}
.cloud2{width:100px;height:26px;top:55%;right:-5px;filter:blur(5px);}
.cloud3{width:80px;height:20px;top:75%;left:55%;filter:blur(4px);}
.hero-inner{position:relative;z-index:2;}
.logo-text{font-size:32px;font-weight:800;color:#fff;letter-spacing:3px;text-shadow:0 2px 12px rgba(0,0,0,0.35);}
.logo-sub{font-size:10px;color:rgba(255,255,255,0.8);letter-spacing:3.5px;font-weight:500;margin-bottom:14px;margin-top:4px;}
.hero-title{font-size:19px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.4);margin-bottom:5px;}
.hero-since{font-size:10px;color:rgba(255,255,255,0.65);letter-spacing:2.5px;}
.tab-bar{display:flex;border-bottom:2px solid #1255b5;background:#fff;flex-shrink:0;}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:13px;color:#888;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:500;}
.tab.active{color:#1255b5;border-bottom:3px solid #1255b5;font-weight:700;}
.tab i{font-size:14px;vertical-align:-2px;margin-right:3px;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.section{padding:16px;}
.section.hidden{display:none;}
.scan-area{border-radius:16px;padding:24px 16px;text-align:center;margin-bottom:14px;background:linear-gradient(145deg,#e3f2fd,#bbdefb);border:1px solid #90caf9;position:relative;overflow:hidden;}
.scan-frame{width:150px;height:150px;margin:0 auto 14px;position:relative;}
.corner{position:absolute;width:28px;height:28px;border-color:#1255b5;border-style:solid;}
.c-tl{top:0;left:0;border-width:3px 0 0 3px;}
.c-tr{top:0;right:0;border-width:3px 3px 0 0;}
.c-bl{bottom:0;left:0;border-width:0 0 3px 3px;}
.c-br{bottom:0;right:0;border-width:0 3px 3px 0;}
.frame-inner{position:absolute;inset:22px;display:flex;align-items:center;justify-content:center;}
.scan-line{position:absolute;left:6px;right:6px;height:2px;background:linear-gradient(to right,transparent,#1255b5 30%,#1976d2,#1255b5 70%,transparent);animation:sl 2s ease-in-out infinite;}
@keyframes sl{0%,100%{top:8px;opacity:0.4;}50%{top:136px;opacity:1;}}
.btn{width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:none;margin-bottom:10px;-webkit-appearance:none;}
.btn-primary{background:linear-gradient(135deg,#0d47a1,#1565c0,#1976d2);color:#fff;}
.btn-green{background:linear-gradient(135deg,#1B6B4A,#1D9E75);color:#fff;}
.btn-outline{background:#fff;color:#1255b5;border:1.5px solid #90caf9;}
.divider{font-size:11px;color:#aaa;text-align:center;margin:10px 0;position:relative;}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:0.5px;background:#dde;}
.divider::before{left:0;}.divider::after{right:0;}
.manual-row{display:flex;gap:8px;margin-bottom:14px;}
.manual-row input{flex:1;padding:12px 14px;border-radius:10px;border:1.5px solid #90caf9;font-size:14px;background:#f5faff;color:#111;outline:none;font-family:inherit;}
.manual-row button{padding:12px 16px;border-radius:10px;background:linear-gradient(135deg,#1255b5,#1976d2);color:#fff;border:none;cursor:pointer;font-size:15px;}
.result-card{border-radius:14px;padding:14px;margin-top:2px;display:none;}
.result-card.found{background:#e8f5e9;border:1px solid #a5d6a7;}
.result-card.notfound{background:#ffebee;border:1px solid #ef9a9a;}
.result-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.result-ico{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.found .result-ico{background:#2e7d32;color:#fff;}
.notfound .result-ico{background:#c62828;color:#fff;}
.result-status{font-size:13px;font-weight:700;}
.found .result-status{color:#2e7d32;}
.notfound .result-status{color:#c62828;}
.result-detail{background:rgba(255,255,255,0.65);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.result-row{display:flex;align-items:flex-start;margin-bottom:5px;}
.rkey{font-size:11px;color:#888;width:60px;flex-shrink:0;padding-top:2px;}
.rval{font-size:13px;font-weight:600;color:#111;word-break:break-all;}
.rval.highlight{color:#1255b5;font-size:14px;}
.info-box{background:#e3f2fd;border-radius:10px;padding:13px;margin-bottom:13px;font-size:13px;color:#0d47a1;line-height:1.8;border:1px solid #90caf9;}
.upload-zone{border:2px dashed #90caf9;border-radius:14px;padding:26px 16px;text-align:center;background:#f0f8ff;margin-bottom:13px;cursor:pointer;}
.file-row{display:flex;align-items:center;gap:11px;padding:12px 14px;background:#f5faff;border-radius:10px;border:1px solid #90caf9;}
.file-info{flex:1;}
.file-name{font-size:13px;font-weight:600;color:#111;}
.file-meta{font-size:11px;color:#888;margin-top:2px;}
.badge{font-size:10px;padding:3px 9px;border-radius:99px;font-weight:600;}
.badge-green{background:#2e7d32;color:#fff;}
.search-wrap{position:relative;margin-bottom:12px;}
.search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:#90caf9;}
.search-input{width:100%;padding:11px 12px 11px 36px;border-radius:10px;border:1.5px solid #90caf9;font-size:14px;background:#f5faff;color:#111;outline:none;font-family:inherit;}
.doc-count{font-size:12px;color:#888;margin-bottom:10px;}
.doc-row{display:flex;align-items:center;gap:11px;padding:13px 14px;background:#fff;border-radius:12px;border:1px solid #e3f2fd;margin-bottom:8px;cursor:pointer;}
.doc-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#ffebee,#ffcdd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.doc-icon i{font-size:22px;color:#c62828;}
.doc-info{flex:1;min-width:0;}
.doc-name{font-size:14px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc-code{font-size:11px;color:#888;margin-top:2px;font-family:monospace;}
.empty{text-align:center;padding:32px 20px;color:#aaa;font-size:14px;}
#cameraSection{display:none;position:fixed;inset:0;background:#000;z-index:100;}
#cameraSection.active{display:block;}
#videoEl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;}
.cam-header{padding:48px 20px 16px;background:rgba(0,0,0,0.6);display:flex;align-items:center;gap:12px;flex-shrink:0;position:relative;z-index:10;}
.cam-header span{color:#fff;font-size:16px;font-weight:600;}
.cam-close{background:rgba(255,255,255,0.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-left:auto;}
.cam-overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;}
.cam-frame{width:220px;height:220px;position:relative;}
.cam-corner{position:absolute;width:36px;height:36px;border-color:#fff;border-style:solid;}
.cam-corner.tl{top:0;left:0;border-width:3px 0 0 3px;}
.cam-corner.tr{top:0;right:0;border-width:3px 3px 0 0;}
.cam-corner.bl{bottom:0;left:0;border-width:0 0 3px 3px;}
.cam-corner.br{bottom:0;right:0;border-width:0 3px 3px 0;}
.cam-scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(to right,transparent,rgba(255,80,80,0.9),transparent);animation:csl 2s ease-in-out infinite;}
@keyframes csl{0%,100%{top:0;opacity:0.5;}50%{top:218px;opacity:1;}}
.cam-hint{position:absolute;bottom:100px;left:0;right:0;text-align:center;color:rgba(255,255,255,0.85);font-size:13px;}
.cam-bottom{position:absolute;bottom:0;left:0;right:0;padding:20px 20px 36px;background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);z-index:10;}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="hero-inner">
      <div class="logo-text">EHWA&#174;</div>
      <div class="logo-sub">QUALITY ASSURANCE Dep&#x27;t</div>
      <div class="hero-title">Q.A Cloud Bar-code Mapping</div>
      <div class="hero-since">EHWA DIAMOND / SINCE 1975</div>
      <div style="position:absolute;top:12px;right:14px;font-size:10px;color:rgba(255,255,255,0.6);font-weight:500;letter-spacing:1px;z-index:3;">V1.02</div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab active" id="tab-btn-scan" onclick="showTab('scan',this)"><i class="ti ti-scan"></i><span id="lbl-scan"></span></div>
    <div class="tab" id="tab-btn-upload" onclick="showTab('upload',this)"><i class="ti ti-upload"></i><span id="lbl-upload"></span></div>
    <div class="tab" id="tab-btn-list" onclick="showTab('list',this)"><i class="ti ti-list"></i><span id="lbl-list"></span></div>
  </div>
  <div class="content">
    <div id="tab-scan" class="section">
      <div class="scan-area">
        <div class="scan-frame">
          <div class="corner c-tl"></div><div class="corner c-tr"></div>
          <div class="corner c-bl"></div><div class="corner c-br"></div>
          <div class="frame-inner"><i class="ti ti-barcode" style="font-size:70px;color:rgba(18,85,181,0.2);"></i></div>
          <div class="scan-line"></div>
        </div>
        <p class="scan-lbl" id="lbl-scan-title"></p>
        <p style="font-size:12px;color:#1565c0;" id="lbl-scan-sub"></p>
      </div>
      <button class="btn btn-primary" onclick="startCamera()" id="mainScanBtn">
        <i class="ti ti-camera"></i> <span id="lbl-cam-btn"></span>
      </button>
      <div class="divider"><span id="lbl-or"></span></div>
      <div class="manual-row">
        <input type="text" id="manualCode" inputmode="numeric" onkeydown="if(event.key==='Enter')searchCode()" />
        <button onclick="searchCode()"><i class="ti ti-search"></i></button>
      </div>
      <div class="result-card" id="resultCard">
        <div class="result-top">
          <div class="result-ico" id="resultIco"></div>
          <span class="result-status" id="resultStatus"></span>
        </div>
        <div class="result-detail" id="resultDetail"></div>
        <div id="openBtnWrap"></div>
      </div>
    </div>
    <div id="tab-upload" class="section hidden">
      <div class="info-box" id="lbl-info-box"></div>
      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <i class="ti ti-table-import" style="font-size:34px;color:#1255b5;display:block;margin-bottom:8px;"></i>
        <p style="font-size:15px;font-weight:700;color:#0a2e6e;margin-bottom:4px;" id="lbl-upload-title"></p>
        <p style="font-size:12px;color:#1565c0;" id="lbl-upload-sub"></p>
      </div>
      <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;" onchange="handleFile(this)">
      <div class="file-row">
        <i class="ti ti-file-spreadsheet" style="font-size:24px;color:#1255b5;"></i>
        <div class="file-info">
          <p class="file-name" id="fileName"></p>
          <p class="file-meta" id="fileMeta"></p>
        </div>
        <span class="badge badge-green" id="lbl-active"></span>
      </div>
      <div style="margin-top:10px;padding:10px 12px;background:#e3f2fd;border-radius:8px;border:1px solid #90caf9;display:flex;align-items:center;gap:8px;">
        <i class="ti ti-cloud-download" style="font-size:16px;color:#1255b5;flex-shrink:0;"></i>
        <span style="font-size:12px;color:#0d47a1;flex:1;" id="loadStatus">데이터 불러오는 중...</span>
        <button onclick="loadCSV()" style="padding:5px 10px;background:#1255b5;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;">새로고침</button>
      </div>
      <div style="margin-top:10px;padding:10px 12px;background:#e3f2fd;border-radius:8px;border:1px solid #90caf9;display:flex;align-items:center;gap:8px;">
        <i class="ti ti-cloud-download" style="font-size:16px;color:#1255b5;flex-shrink:0;"></i>
        <span style="font-size:12px;color:#0d47a1;" id="loadStatus"></span>
        <button onclick="loadCSV()" style="margin-left:auto;padding:5px 10px;background:#1255b5;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;">새로고침</button>
      </div>
    </div>
    <div id="tab-list" class="section hidden">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input class="search-input" id="searchInput" type="text" oninput="filterList(this.value)">
      </div>
      <p class="doc-count" id="docCount"></p>
      <div id="docList"></div>
    </div>
  </div>
</div>
<div id="cameraSection">
  <div class="cam-header">
    <i class="ti ti-camera" style="color:#fff;font-size:20px;"></i>
    <span id="lbl-cam-header"></span>
    <button class="cam-close" onclick="stopCamera()"><i class="ti ti-x"></i></button>
  </div>
  <video id="videoEl" autoplay playsinline muted></video>
<input type="file" id="iosPhotoInput" accept="image/*" capture="environment" style="display:none;" onchange="handleIOSPhoto(this)">
  <div class="cam-overlay">
    <div class="cam-frame">
      <div class="cam-corner tl"></div><div class="cam-corner tr"></div>
      <div class="cam-corner bl"></div><div class="cam-corner br"></div>
      <div class="cam-scanline"></div>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.6);"></div>
    </div>
    <div style="position:absolute;top:calc(50% + 125px);color:rgba(255,255,255,0.75);font-size:12px;text-align:center;">바코드를 프레임 안에 맞춰주세요</div>
  </div>
  <p class="cam-hint" id="lbl-cam-hint"></p>
  <div class="cam-bottom">
    <div style="display:flex;gap:10px;">
      <button class="btn btn-outline" onclick="stopCamera()" style="flex:1;">
        <i class="ti ti-x"></i> <span id="lbl-cancel"></span>
      </button>
      <button class="btn btn-outline" onclick="toggleTorch()" id="torchBtn" style="flex:1;">
        <i class="ti ti-flashlight"></i> <span id="lbl-torch">플래시</span>
      </button>
      <button class="btn btn-outline" onclick="focusCamera()" style="flex:1;">
        <i class="ti ti-focus-2"></i> <span>포커스</span>
      </button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>
<script>
var T = {
  scan: '\uc2a4\uce94',
  upload: '\uc5c5\ub85c\ub4dc',
  list: '\ubaa9\ub85d',
  scanTitle: '\ubc14\ucf54\ub4dc / QR \uc2a4\uce94',
  scanSub: '\uce74\uba54\ub77c\ub85c \ucf54\ub4dc\ub97c \ube44\ucd94\uc138\uc694',
  camBtn: '\uce74\uba54\ub77c\ub85c \uc2a4\uce94',
  orText: '\ub610\ub294 \uc9c1\uc811 \uc785\ub825',
  placeholder: '\ubc14\ucf54\ub4dc \ubc88\ud638 \uc785\ub825...',
  infoBox: '<strong>\uc5d1\uc140 \ucf5c\ub7fc \ud615\uc2dd \uc548\ub0b4</strong><br>A\uc5f4: \ubc14\ucf54\ub4dc / QR \ubc88\ud638<br>B\uc5f4: \ubb38\uc11c\uba85<br>C\uc5f4: OneDrive PDF \ub9c1\ud06c',
  uploadTitle: '\uc0c8 \uc5d1\uc140 \ud30c\uc77c \uc5c5\ub85c\ub4dc',
  uploadSub: '.xlsx \ub610\ub294 .csv \ud30c\uc77c',
  defaultFile: '\ud3ec\uc7a5_\ubc14\ucf54\ub4dc.xlsx',
  defaultMeta: '2\uac1c \ud56d\ubaa9 \u00b7 \ud65c\uc131',
  active: '\ud65c\uc131',
  searchPlaceholder: '\ubb38\uc11c\uba85 \ub610\ub294 \ubc14\ucf54\ub4dc \uac80\uc0c9...',
  total: '\uc804\uccb4 ',
  count: '\uac1c',
  found: '\uc9c0\ub3c4\uc11c\ub97c \ucc3e\uc558\uc2b5\ub2c8\uB2e4',
  notfound: '\ud574\ub2f9 \ubc14\ucf54\ub4dc \uc9c0\ub3c4\uc11c \uc5c6\uc74c',
  barcode: '\ubc14\ucf54\ub4dc',
  docname: '\ubb38\uc11c\uba85',
  openPdf: 'PDF \uc5f4\uae30 (OneDrive)',
  camHeader: '\ubc14\ucf54\ub4dc \uc2a4\uce94',
  camHint: '\ubc14\ucf54\ub4dc\ub97c \ud504\ub808\uc784 \uc548\uc5d0 \ub9de\ucdb0\uc8fc\uc138\uc694',
  cancel: '\ucde8\uc18c',
  noResult: '\uac80\uc0c9 \uacb0\uacfc\uac00 \uc5c6\uc2b5\ub2c8\uB2e4',

  camError2: '\uce74\uba54\ub77c\ub97c \uCC3E\uc744 \uc218 \uc5c6\uc2b5\ub2c8\uB2e4.',
  xlsxMsg: 'xlsx\ud30c\uc77c\uc740 CSV\ub85c \ubcc0\ud658 \ud6c4 \uc5c5\ub85c\ub4dc\ud574\uc8fc\uc138\uc694.',

function initLabels() {
  document.getElementById('lbl-scan').textContent = T.scan;
  document.getElementById('lbl-upload').textContent = T.upload;
  document.getElementById('lbl-list').textContent = T.list;
  document.getElementById('lbl-scan-title').textContent = T.scanTitle;
  document.getElementById('lbl-scan-sub').textContent = T.scanSub;
  var isIOSinit = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  document.getElementById('lbl-cam-btn').textContent = isIOSinit ? '카메라로 바코드 찍기 (iOS)' : T.camBtn;
  document.getElementById('lbl-or').textContent = T.orText;
  document.getElementById('manualCode').placeholder = T.placeholder;
  document.getElementById('lbl-info-box').innerHTML = T.infoBox;
  document.getElementById('lbl-upload-title').textContent = T.uploadTitle;
  document.getElementById('lbl-upload-sub').textContent = T.uploadSub;
  document.getElementById('fileName').textContent = T.defaultFile;
  document.getElementById('fileMeta').textContent = T.defaultMeta;
  document.getElementById('lbl-active').textContent = T.active;
  document.getElementById('searchInput').placeholder = T.searchPlaceholder;
  document.getElementById('docCount').textContent = T.total + DB.length + T.count;
  // camera UI built dynamically
}

var DB = [];
var XLSX_URL = 'https://icdide.github.io/quality/data.xlsx';

function loadCSV() {
  loadXLSX();
}

function loadXLSX() {
  var statusEl = document.getElementById('loadStatus');
  if(statusEl) statusEl.textContent = '데이터 불러오는 중...';
  fetch(XLSX_URL + '?t=' + Date.now())
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.arrayBuffer();
    })
    .then(function(buf){
      var wb = XLSX.read(buf, {type:'array', raw:false, cellText:false});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
      var newDB = [];
      for(var i=1; i<rows.length; i++){
        var row = rows[i];
        // 바코드: raw:true로 읽어서 셀 원본값 사용, 숫자면 정수 변환
        var rawCode = row[0];
        var code = '';
        if(rawCode === undefined || rawCode === null || rawCode === '') continue;
        if(typeof rawCode === 'number'){
          // 부동소수점 정밀도 문제 해결: 셀 주소로 원본 텍스트 재확인
          var cellAddr = XLSX.utils.encode_cell({r:i, c:0});
          var cell = ws[cellAddr];
          if(cell && cell.w) {
            // w: 셀에 표시된 텍스트 (서식 적용된 값)
            code = cell.w.replace(/,/g,'').trim();
          } else {
            // BigInt로 정수 변환 (부동소수점 오차 제거)
            try{ code = BigInt(rawCode).toString(); }
            catch(ex){ code = Math.round(rawCode).toString(); }
          }
        } else {
          code = rawCode.toString().trim();
        }
        if(!code) continue;
        var name = (row[1]||'').toString().trim();
        var url  = (row[2]||'').toString().trim();
        if(!url) continue;
        newDB.push({code:code, name:name, url:url});
      }
      if(newDB.length > 0){
        DB = newDB;
        var metaEl = document.getElementById('fileMeta');
        var countEl = document.getElementById('docCount');
        if(metaEl) metaEl.textContent = DB.length + '개 항목 · 활성';
        if(countEl) countEl.textContent = '전체 ' + DB.length + '개';
        if(statusEl) statusEl.textContent = '✓ ' + DB.length + '개 항목 로드 완료';
        renderList(DB);
      } else {
        if(statusEl) statusEl.textContent = '데이터가 비어있습니다.';
      }
    })
    .catch(function(e){
      if(statusEl) statusEl.textContent = '로드 실패: ' + e.message;
      console.error(e);
    });
}

function searchCode(code) {
  var q = (code !== undefined ? code : document.getElementById('manualCode').value).trim();
  if(!q) return;
  var found = null;
  for(var i=0;i<DB.length;i++){if(DB[i].code===q){found=DB[i];break;}}
  var card = document.getElementById('resultCard');
  card.style.display='block';
  if(found){
    card.className='result-card found';
    document.getElementById('resultIco').textContent='\u2713';
    document.getElementById('resultStatus').textContent=T.found;
    document.getElementById('resultDetail').innerHTML=
      '<div class="result-row"><span class="rkey">'+T.barcode+'</span><span class="rval">'+found.code+'</span></div>'+
      '<div class="result-row"><span class="rkey">'+T.docname+'</span><span class="rval highlight">'+found.name+'</span></div>';
    document.getElementById('openBtnWrap').innerHTML=
      '<button class="btn btn-green" onclick="openPDF(\''+found.url+'\')">'+
      '<i class="ti ti-file-type-pdf"></i> '+T.openPdf+'</button>';
  } else {
    card.className='result-card notfound';
    document.getElementById('resultIco').textContent='\u2717';
    document.getElementById('resultStatus').textContent=T.notfound;
    document.getElementById('resultDetail').innerHTML=
      '<div class="result-row"><span class="rkey">'+T.barcode+'</span><span class="rval">'+q+'</span></div>';
    document.getElementById('openBtnWrap').innerHTML='';
  }
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function openPDF(url){

function waitForZXing(stream){
  // html5-qrcode handles its own video - stop the stream we started
  if(stream){ stream.getTracks().forEach(function(t){t.stop();}); }
  if(typeof Html5Qrcode === 'undefined'){
    setTimeout(function(){ waitForZXing(null); }, 300); return;
  }
  // Create scan div inside overlay
  var overlay = document.getElementById('camOverlay');
  var scanDiv = document.createElement('div');
  scanDiv.id = 'html5qr-scan';
  scanDiv.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;';
  // Insert before header (z-index layering)
  overlay.insertBefore(scanDiv, overlay.firstChild);

  codeReader = new Html5Qrcode('html5qr-scan');
  var config = {
    fps: 15,
    qrbox: { width: 250, height: 200 },
    aspectRatio: window.innerHeight / window.innerWidth,
    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.DATA_MATRIX,
      Html5QrcodeSupportedFormats.CODABAR,
      Html5QrcodeSupportedFormats.CODE_93
    ]
  };

  codeReader.start(
    { facingMode: 'environment' },
    config,
    function(code, result){
      if(!streamActive) return;
      streamActive = false;
      stopCamera();
      document.getElementById('manualCode').value = code;
      searchCode(code);
      if(navigator.vibrate) navigator.vibrate([100,50,100]);
    },
    function(err){ /* scan attempt failed - keep trying */ }
  ).catch(function(e){ console.error('html5qrcode start error:', e); });
}

function startScanning(v){
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  // iOS Safari: 카메라 앱으로 사진 촬영 후 ZXing 디코딩 (가장 안정적)
  if(isIOS){
    // 카메라 오버레이 닫고 iOS 사진 입력 사용
    stopCamera();
    document.getElementById('iosPhotoInput').value = '';
    document.getElementById('iosPhotoInput').click();
    return;
  }

  // Android: BarcodeDetector API (내장 엔진 - 가장 정확)
  if('BarcodeDetector' in window){
    var detector = new BarcodeDetector({
      formats:['qr_code','code_39','code_128','ean_13','ean_8','upc_a','upc_e','itf','data_matrix','codabar','code_93']
    });
    function detect(){
      if(!streamActive) return;
      detector.detect(v).then(function(barcodes){
        if(barcodes.length>0 && streamActive){
          streamActive=false;
          var code=barcodes[0].rawValue;
          if(navigator.vibrate) navigator.vibrate([100,50,100]);
          stopCamera();
          document.getElementById('manualCode').value=code;
          searchCode(code);
        } else {
          if(streamActive) scanInterval=setTimeout(detect,150);
        }
      }).catch(function(){ if(streamActive) scanInterval=setTimeout(detect,150); });
    }
    detect();
    return;
  }

  // 기타 기기: ZXing 폴백
  function tryZXing(){
    if(typeof ZXing==='undefined'){ setTimeout(tryZXing,300); return; }
    var canvas=document.createElement('canvas');
    var ctx=canvas.getContext('2d');
    var hints=new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
      ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,   ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,   ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.CODABAR, ZXing.BarcodeFormat.CODE_93,
      ZXing.BarcodeFormat.DATA_MATRIX
    ]);
    var reader=new ZXing.MultiFormatReader();
    reader.setHints(hints);
    function scan(){
      if(!streamActive) return;
      if(v.readyState<2){ scanInterval=setTimeout(scan,100); return; }
      try{
        canvas.width=v.videoWidth; canvas.height=v.videoHeight;
        ctx.drawImage(v,0,0);
        var imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
        var lum=new ZXing.RGBLuminanceSource(imgData.data,canvas.width,canvas.height);
        var bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
        var result=reader.decode(bmp);
        if(result && streamActive){
          streamActive=false;
          var code=result.getText();
          if(navigator.vibrate) navigator.vibrate([100,50,100]);
          stopCamera();
          document.getElementById('manualCode').value=code;
          searchCode(code);
          return;
        }
      }catch(e){}
      if(streamActive) scanInterval=setTimeout(scan,100);
    }
    scan();
  }
  tryZXing();
}

function startCamera(){
  buildCamUI();
  // 안드로이드 크롬 자동초점 최적화 제약조건
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var constraints={
    video: isIOS ? {
      facingMode:{ideal:'environment'},
      width:{min:640, ideal:1280, max:1920},
      height:{min:480, ideal:720, max:1080}
    } : {
      facingMode:{ideal:'environment'},
      width:{min:640, ideal:1920, max:1920},
      height:{min:480, ideal:1080, max:1080},
      focusMode:{ideal:'continuous'},
      exposureMode:{ideal:'continuous'},
      whiteBalanceMode:{ideal:'continuous'}
    }
  };
  navigator.mediaDevices.getUserMedia(constraints)
  .then(function(stream){
    videoStream=stream;
    var track=stream.getVideoTracks()[0];
    // 연속 자동초점 강제 적용 (Android only - iOS는 자동으로 처리)
    if(track && track.applyConstraints && !isIOS){
      track.applyConstraints({
        advanced:[
          {focusMode:'continuous'},
          {exposureMode:'continuous'},
          {whiteBalanceMode:'continuous'}
        ]
      }).catch(function(){});
    }
    var v=document.getElementById('videoEl');
    v.srcObject=stream;
    v.setAttribute('playsinline','');
    v.setAttribute('autoplay','');
    v.muted=true;
    v.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:2;display:block;';
    v.play().then(function(){
      streamActive=true;
      var isIOS2 = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      var delay = isIOS2 ? 1500 : 800;
      // iOS는 loadeddata 이벤트 후 스캔 시작
      if(isIOS2){
        v.addEventListener('loadeddata', function onLoaded(){
          v.removeEventListener('loadeddata', onLoaded);
          setTimeout(function(){ startScanning(v); }, 500);
        });
        // 폴백: 이벤트 안 오면 타임아웃으로
        setTimeout(function(){
          if(streamActive && v.videoWidth>0) startScanning(v);
        }, 2000);
      } else {
        setTimeout(function(){ startScanning(v); }, delay);
      }
    }).catch(function(e){ console.error(e); });
  }).catch(function(err){
    var o=document.getElementById('camOverlay');
    if(o) document.body.removeChild(o);
    alert(err.name==='NotFoundError'?T.camError2:T.camError1);
  });
}

function handleIOSPhoto(input){
  var file = input.files[0];
  if(!file) return;

  // 상태 표시
  var card = document.getElementById('resultCard');
  card.style.display = 'block';
  card.className = 'result-card found';
  document.getElementById('resultIco').textContent = '...';
  document.getElementById('resultStatus').textContent = '스캔 중...';
  document.getElementById('resultDetail').innerHTML = '';
  document.getElementById('openBtnWrap').innerHTML = '';

  var img = new Image();
  var url = URL.createObjectURL(file);
  img.onload = function(){
    URL.revokeObjectURL(url);
    // 여러 해상도로 시도
    var sizes = [
      {w: img.width, h: img.height},
      {w: Math.min(img.width, 1200), h: Math.round(img.height * Math.min(1200/img.width, 1))},
      {w: 800, h: Math.round(img.height * 800/img.width)},
      {w: 400, h: Math.round(img.height * 400/img.width)},
    ];

    function tryZXingPhoto(){
      if(typeof ZXing === 'undefined'){ setTimeout(tryZXingPhoto, 300); return; }
      var hints = new Map();
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.QR_CODE, ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8,   ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E,   ZXing.BarcodeFormat.ITF,
        ZXing.BarcodeFormat.CODABAR, ZXing.BarcodeFormat.CODE_93,
        ZXing.BarcodeFormat.DATA_MATRIX
      ]);
      var reader = new ZXing.MultiFormatReader();
      reader.setHints(hints);

      var decoded = null;

      // 각 해상도별 전체 + 영역 스캔
      for(var si=0; si<sizes.length && !decoded; si++){
        var s = sizes[si];
        var canvas = document.createElement('canvas');
        canvas.width = s.w; canvas.height = s.h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, s.w, s.h);

        // 전체
        decoded = decodeCanvas(ctx, s.w, s.h, reader);
        if(decoded) break;

        // 중앙 수평띠
        var bh = Math.floor(s.h * 0.4);
        var by = Math.floor(s.h * 0.3);
        var c2 = document.createElement('canvas');
        c2.width = s.w; c2.height = bh;
        var cx2 = c2.getContext('2d');
        cx2.drawImage(img, 0, Math.floor(img.height*0.3), img.width, Math.floor(img.height*0.4), 0, 0, s.w, bh);
        decoded = decodeCanvas(cx2, s.w, bh, reader);
        if(decoded) break;

        // 중앙 80%
        var cw = Math.floor(s.w * 0.8), ch = Math.floor(s.h * 0.8);
        var c3 = document.createElement('canvas');
        c3.width = cw; c3.height = ch;
        var cx3 = c3.getContext('2d');
        cx3.drawImage(img, Math.floor(img.width*0.1), Math.floor(img.height*0.1), Math.floor(img.width*0.8), Math.floor(img.height*0.8), 0, 0, cw, ch);
        decoded = decodeCanvas(cx3, cw, ch, reader);
        if(decoded) break;
      }

      if(decoded){
        document.getElementById('manualCode').value = decoded;
        // DB에서 바로 찾아서 자동으로 PDF 열기
        var found = null;
        for(var i=0;i<DB.length;i++){
          if(DB[i].code === decoded){ found=DB[i]; break; }
        }
        if(found){
          // searchCode로 UI 표시 후 바로 PDF 오픈
          searchCode(decoded);
          setTimeout(function(){ window.location.href = found.url; }, 500);
        } else {
          searchCode(decoded);
        }
      } else {
        card.className = 'result-card notfound';
        document.getElementById('resultIco').textContent = '✗';
        document.getElementById('resultStatus').textContent = '바코드를 인식하지 못했습니다. 다시 찍어주세요.';
        document.getElementById('resultDetail').innerHTML = '<div class="result-row"><span class="rkey">팁</span><span class="rval">바코드가 화면 중앙에 오도록 찍어주세요</span></div>';
      }
    }
    tryZXingPhoto();
  };
  img.src = url;
}

function decodeCanvas(ctx, w, h, reader){
  try{
    var imgData = ctx.getImageData(0, 0, w, h);
    var lum = new ZXing.RGBLuminanceSource(imgData.data, w, h);
    var bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
    var result = reader.decode(bmp);
    if(result) return result.getText();
  }catch(e){}
  return null;
}

function stopCamera(){
  streamActive=false;
  torchOn=false;
  currentZoom=1;
  if(scanInterval){ clearTimeout(scanInterval); scanInterval=null; }
  if(videoStream){ videoStream.getTracks().forEach(function(t){t.stop();}); videoStream=null; }
  var v=document.getElementById('videoEl');
  if(v){ v.srcObject=null; v.style.display='none'; document.body.appendChild(v); }
  var o=document.getElementById('camOverlay');
  if(o) document.body.removeChild(o);
}

function handleFile(input){
  var file=input.files[0];
  if(!file)return;
  document.getElementById('fileName').textContent=file.name;
  if(file.name.toLowerCase().endsWith('.csv')){
    var reader=new FileReader();
    reader.onload=function(e){
      var lines=e.target.result.split('\n').filter(function(l){return l.trim();});
      var newDB=[];
      for(var i=1;i<lines.length;i++){
        var parts=lines[i].split(',');
        if(parts.length>=3&&parts[0].trim()&&parts[2].trim())
          newDB.push({code:parts[0].trim(),name:(parts[1]||'').trim(),url:parts[2].trim()});
      }
      if(newDB.length>0){
        DB=newDB;
        document.getElementById('fileMeta').textContent=DB.length+T.count+' \u00b7 '+T.active;
        alert(DB.length+T.loaded);
      }
    };
    reader.readAsText(file,'UTF-8');
  } else {
    alert(T.xlsxMsg);
  }
}

function renderList(data){
  document.getElementById('docCount').textContent=T.total+data.length+T.count;
  var el=document.getElementById('docList');
  if(!data.length){el.innerHTML='<div class="empty">'+T.noResult+'</div>';return;}
  var html='';
  for(var i=0;i<data.length;i++){
    var d=data[i];
    html+='<div class="doc-row" onclick="goScan(\''+d.code+'\')">'+
      '<div class="doc-icon"><i class="ti ti-file-type-pdf"></i></div>'+
      '<div class="doc-info"><p class="doc-name">'+d.name+'</p><p class="doc-code">'+d.code+'</p></div>'+
      '<i class="ti ti-chevron-right" style="color:#90caf9;font-size:16px;flex-shrink:0;"></i></div>';
  }
  el.innerHTML=html;
}

function filterList(q){
  var filtered=q?DB.filter(function(d){return d.name.indexOf(q)>=0||d.code.indexOf(q)>=0;}):DB;
  renderList(filtered);
}

function goScan(code){
  showTab('scan',document.getElementById('tab-btn-scan'));
  document.getElementById('manualCode').value=code;
  searchCode(code);
}

initLabels();
loadCSV();
</script>
</body>
</html>
