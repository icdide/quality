<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>EHWA Q.A Barcode</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f4f8;overscroll-behavior:none;}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column;}
.hero{position:relative;background:linear-gradient(145deg,#0a2e6e 0%,#1255b5 45%,#1976d2 70%,#64b5f6 100%);padding:28px 20px 30px;text-align:center;overflow:hidden;flex-shrink:0;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 75% 25%,rgba(255,255,255,0.18) 0%,transparent 55%);}
.cloud{position:absolute;background:rgba(255,255,255,0.15);border-radius:60px;}
.cloud1{width:130px;height:32px;top:18%;left:-15px;filter:blur(6px);}
.cloud2{width:100px;height:26px;top:55%;right:-5px;filter:blur(5px);}
.cloud3{width:80px;height:20px;top:75%;left:55%;filter:blur(4px);}
.hero-inner{position:relative;z-index:2;}
.logo-text{font-size:32px;font-weight:800;color:#fff;letter-spacing:3px;text-shadow:0 2px 12px rgba(0,0,0,0.35);}
.logo-sub{font-size:10px;color:rgba(255,255,255,0.8);letter-spacing:3.5px;font-weight:500;margin-bottom:14px;margin-top:4px;}
.hero-title{font-size:19px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.4);margin-bottom:5px;}
.hero-since{font-size:10px;color:rgba(255,255,255,0.65);letter-spacing:2.5px;}
.tab-bar{display:flex;border-bottom:2px solid #1255b5;background:#fff;flex-shrink:0;}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:13px;color:#888;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:500;}
.tab.active{color:#1255b5;border-bottom:3px solid #1255b5;font-weight:700;}
.tab i{font-size:14px;vertical-align:-2px;margin-right:3px;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.section{padding:16px;}
.section.hidden{display:none;}
.scan-area{border-radius:16px;padding:24px 16px;text-align:center;margin-bottom:14px;background:linear-gradient(145deg,#e3f2fd,#bbdefb);border:1px solid #90caf9;position:relative;overflow:hidden;}
.scan-frame{width:150px;height:150px;margin:0 auto 14px;position:relative;}
.corner{position:absolute;width:28px;height:28px;border-color:#1255b5;border-style:solid;}
.c-tl{top:0;left:0;border-width:3px 0 0 3px;}
.c-tr{top:0;right:0;border-width:3px 3px 0 0;}
.c-bl{bottom:0;left:0;border-width:0 0 3px 3px;}
.c-br{bottom:0;right:0;border-width:0 3px 3px 0;}
.frame-inner{position:absolute;inset:22px;display:flex;align-items:center;justify-content:center;}
.scan-line{position:absolute;left:6px;right:6px;height:2px;background:linear-gradient(to right,transparent,#1255b5 30%,#1976d2,#1255b5 70%,transparent);animation:sl 2s ease-in-out infinite;}
@keyframes sl{0%,100%{top:8px;opacity:0.4;}50%{top:136px;opacity:1;}}
.btn{width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:none;margin-bottom:10px;-webkit-appearance:none;}
.btn-primary{background:linear-gradient(135deg,#0d47a1,#1565c0,#1976d2);color:#fff;}
.btn-green{background:linear-gradient(135deg,#1B6B4A,#1D9E75);color:#fff;}
.btn-outline{background:#fff;color:#1255b5;border:1.5px solid #90caf9;}
.divider{font-size:11px;color:#aaa;text-align:center;margin:10px 0;position:relative;}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:0.5px;background:#dde;}
.divider::before{left:0;}.divider::after{right:0;}
.manual-row{display:flex;gap:8px;margin-bottom:14px;}
.manual-row input{flex:1;padding:12px 14px;border-radius:10px;border:1.5px solid #90caf9;font-size:14px;background:#f5faff;color:#111;outline:none;font-family:inherit;}
.manual-row button{padding:12px 16px;border-radius:10px;background:linear-gradient(135deg,#1255b5,#1976d2);color:#fff;border:none;cursor:pointer;font-size:15px;}
.result-card{border-radius:14px;padding:14px;margin-top:2px;display:none;}
.result-card.found{background:#e8f5e9;border:1px solid #a5d6a7;}
.result-card.notfound{background:#ffebee;border:1px solid #ef9a9a;}
.result-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.result-ico{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.found .result-ico{background:#2e7d32;color:#fff;}
.notfound .result-ico{background:#c62828;color:#fff;}
.result-status{font-size:13px;font-weight:700;}
.found .result-status{color:#2e7d32;}
.notfound .result-status{color:#c62828;}
.result-detail{background:rgba(255,255,255,0.65);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.result-row{display:flex;align-items:flex-start;margin-bottom:5px;}
.rkey{font-size:11px;color:#888;width:60px;flex-shrink:0;padding-top:2px;}
.rval{font-size:13px;font-weight:600;color:#111;word-break:break-all;}
.rval.highlight{color:#1255b5;font-size:14px;}
.info-box{background:#e3f2fd;border-radius:10px;padding:13px;margin-bottom:13px;font-size:13px;color:#0d47a1;line-height:1.8;border:1px solid #90caf9;}
.upload-zone{border:2px dashed #90caf9;border-radius:14px;padding:26px 16px;text-align:center;background:#f0f8ff;margin-bottom:13px;cursor:pointer;}
.file-row{display:flex;align-items:center;gap:11px;padding:12px 14px;background:#f5faff;border-radius:10px;border:1px solid #90caf9;}
.file-info{flex:1;}
.file-name{font-size:13px;font-weight:600;color:#111;}
.file-meta{font-size:11px;color:#888;margin-top:2px;}
.badge{font-size:10px;padding:3px 9px;border-radius:99px;font-weight:600;}
.badge-green{background:#2e7d32;color:#fff;}
.search-wrap{position:relative;margin-bottom:12px;}
.search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:#90caf9;}
.search-input{width:100%;padding:11px 12px 11px 36px;border-radius:10px;border:1.5px solid #90caf9;font-size:14px;background:#f5faff;color:#111;outline:none;font-family:inherit;}
.doc-count{font-size:12px;color:#888;margin-bottom:10px;}
.doc-row{display:flex;align-items:center;gap:11px;padding:13px 14px;background:#fff;border-radius:12px;border:1px solid #e3f2fd;margin-bottom:8px;cursor:pointer;}
.doc-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#ffebee,#ffcdd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.doc-icon i{font-size:22px;color:#c62828;}
.doc-info{flex:1;min-width:0;}
.doc-name{font-size:14px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc-code{font-size:11px;color:#888;margin-top:2px;font-family:monospace;}
.empty{text-align:center;padding:32px 20px;color:#aaa;font-size:14px;}
#videoEl{display:none;}
@keyframes csl{0%,100%{top:0;opacity:0.4;}50%{top:210px;opacity:1;}}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="hero-inner">
      <div class="logo-text">EHWA&#174;</div>
      <div class="logo-sub">QUALITY ASSURANCE Dep&#x27;t</div>
      <div class="hero-title">Q.A Cloud Bar-code Mapping</div>
      <div class="hero-since">EHWA DIAMOND / SINCE 1975</div>
      <div style="position:absolute;top:12px;right:14px;font-size:10px;color:rgba(255,255,255,0.6);font-weight:500;letter-spacing:1px;z-index:3;">V1.04</div>
    </div>
  </div>
  <div class="tab-bar">
    <div class="tab active" id="tab-btn-scan" onclick="showTab('scan',this)"><i class="ti ti-scan"></i><span id="lbl-scan"></span></div>
    <div class="tab" id="tab-btn-upload" onclick="showTab('upload',this)"><i class="ti ti-upload"></i><span id="lbl-upload"></span></div>
    <div class="tab" id="tab-btn-list" onclick="showTab('list',this)"><i class="ti ti-list"></i><span id="lbl-list"></span></div>
  </div>
  <div class="content">
    <div id="tab-scan" class="section">
      <div class="scan-area">
        <div class="scan-frame">
          <div class="corner c-tl"></div><div class="corner c-tr"></div>
          <div class="corner c-bl"></div><div class="corner c-br"></div>
          <div class="frame-inner"><i class="ti ti-barcode" style="font-size:70px;color:rgba(18,85,181,0.2);"></i></div>
          <div class="scan-line"></div>
        </div>
        <p id="lbl-scan-title" style="font-size:15px;font-weight:700;color:#0a2e6e;margin-bottom:3px;"></p>
        <p id="lbl-scan-sub" style="font-size:12px;color:#1565c0;"></p>
      </div>
      <button class="btn btn-primary" onclick="startCamera()">
        <i class="ti ti-camera"></i> <span id="lbl-cam-btn"></span>
      </button>
      <div class="divider"><span id="lbl-or"></span></div>
      <div class="manual-row">
        <input type="text" id="manualCode" inputmode="numeric" onkeydown="if(event.key==='Enter')searchCode()" />
        <button onclick="searchCode()"><i class="ti ti-search"></i></button>
      </div>
      <div class="result-card" id="resultCard">
        <div class="result-top">
          <div class="result-ico" id="resultIco"></div>
          <span class="result-status" id="resultStatus"></span>
        </div>
        <div class="result-detail" id="resultDetail"></div>
        <div id="openBtnWrap"></div>
      </div>
    </div>
    <div id="tab-upload" class="section hidden">
      <div class="info-box" id="lbl-info-box"></div>
      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <i class="ti ti-table-import" style="font-size:34px;color:#1255b5;display:block;margin-bottom:8px;"></i>
        <p style="font-size:15px;font-weight:700;color:#0a2e6e;margin-bottom:4px;" id="lbl-upload-title"></p>
        <p style="font-size:12px;color:#1565c0;" id="lbl-upload-sub"></p>
      </div>
      <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;" onchange="handleFile(this)">
      <div class="file-row">
        <i class="ti ti-file-spreadsheet" style="font-size:24px;color:#1255b5;"></i>
        <div class="file-info">
          <p class="file-name" id="fileName"></p>
          <p class="file-meta" id="fileMeta"></p>
        </div>
        <span class="badge badge-green" id="lbl-active"></span>
      </div>
      <div style="margin-top:10px;padding:10px 12px;background:#e3f2fd;border-radius:8px;border:1px solid #90caf9;display:flex;align-items:center;gap:8px;">
        <i class="ti ti-cloud-download" style="font-size:16px;color:#1255b5;flex-shrink:0;"></i>
        <span style="font-size:12px;color:#0d47a1;flex:1;" id="loadStatus"></span>
        <button onclick="loadXLSX()" style="padding:5px 10px;background:#1255b5;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;" id="lbl-refresh"></button>
      </div>
    </div>
    <div id="tab-list" class="section hidden">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input class="search-input" id="searchInput" type="text" oninput="filterList(this.value)">
      </div>
      <p class="doc-count" id="docCount"></p>
      <div id="docList"></div>
    </div>
  </div>
</div>
<video id="videoEl" autoplay playsinline muted></video>

<script>
var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

var T = {
  scan:'\uc2a4\uce94', upload:'\uc5c5\ub85c\ub4dc', list:'\ubaa9\ub85d',
  scanTitle:'\ubc14\ucf54\ub4dc / QR \uc2a4\uce94',
  scanSub:'\uce74\uba54\ub77c\ub85c \ucf54\ub4dc\ub97c \ube44\ucdb0\uc8fc\uc138\uc694',
  camBtn:'\uce74\uba54\ub77c\ub85c \uc2a4\uce94',
  camBtnIOS:'\uce74\uba54\ub77c\ub85c \ubc14\ucf54\ub4dc \ucc0d\uae30',
  orText:'\ub610\ub294 \uc9c1\uc811 \uc785\ub825',
  placeholder:'\ubc14\ucf54\ub4dc \ubc88\ud638 \uc785\ub825...',
  infoBox:'<strong>\uc5d1\uc140 \ucf5c\ub7fc \ud615\uc2dd</strong><br>A\uc5f4: \ubc14\ucf54\ub4dc / QR \ubc88\ud638<br>B\uc5f4: \ubb38\uc11c\uba85<br>C\uc5f4: OneDrive PDF \ub9c1\ud06c',
  uploadTitle:'\uc0c8 \uc5d1\uc140 \ud30c\uc77c \uc5c5\ub85c\ub4dc',
  uploadSub:'.xlsx \ud30c\uc77c',
  defaultFile:'data.xlsx', defaultMeta:'- \ud56d\ubaa9 \u00b7 \ud65c\uc131',
  active:'\ud65c\uc131', refresh:'\uc0c8\ub85c\uace0\uce68',
  searchPlaceholder:'\ubb38\uc11c\uba85 \ub610\ub294 \ubc14\ucf54\ub4dc \uac80\uc0c9...',
  total:'\uc804\uccb4 ', count:'\uac1c',
  found:'\uc9c0\ub3c4\uc11c\ub97c \ucc3e\uc558\uc2b5\ub2c8\ub2e4',
  notfound:'\ud574\ub2f9 \ubc14\ucf54\ub4dc \uc9c0\ub3c4\uc11c \uc5c6\uc74c',
  barcode:'\ubc14\ucf54\ub4dc', docname:'\ubb38\uc11c\uba85',
  openPdf:'PDF \uc5f4\uae30 (OneDrive)',
  noResult:'\uac80\uc0c9 \uacb0\uacfc\uac00 \uc5c6\uc2b5\ub2c8\ub2e4',
  loading:'\ub370\uc774\ud130 \ubd88\ub7ec\uc624\ub294 \uc911...',
  loadOk:'\uac1c \ud56d\ubaa9 \ub85c\ub4dc \uc644\ub8cc',
  loadFail:'\ub85c\ub4dc \uc2e4\ud328: ',
  camHeader:'\ubc14\ucf54\ub4dc \uc2a4\uce94',
  camHint:'\ubc14\ucf54\ub4dc\ub97c \ud504\ub808\uc784 \uc548\uc5d0 \ub9de\ucdb0\uc8fc\uc138\uc694',
  cancel:'\ucde8\uc18c',
  scanning:'\uc2a4\uce94 \uc911...',
  scanFail:'\ubc14\ucf54\ub4dc \uc778\uc2dd \uc2e4\ud328 - \ub2e4\uc2dc \uc2dc\ub3c4\ud574\uc8fc\uc138\uc694',
  camErr:'\uce74\uba54\ub77c\ub97c \uc5f4 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.\n\ube0c\ub77c\uc6b0\uc800 \uc124\uc815\uc5d0\uc11c \uce74\uba54\ub77c \uad8c\ud55c\uc744 \ud5c8\uc6a9\ud574\uc8fc\uc138\uc694.'
};

var DB = [];
var XLSX_URL = 'https://icdide.github.io/quality/data.xlsx';

function initLabels(){
  document.getElementById('lbl-scan').textContent = T.scan;
  document.getElementById('lbl-upload').textContent = T.upload;
  document.getElementById('lbl-list').textContent = T.list;
  document.getElementById('lbl-scan-title').textContent = T.scanTitle;
  document.getElementById('lbl-scan-sub').textContent = T.scanSub;
  document.getElementById('lbl-cam-btn').textContent = isIOS ? T.camBtnIOS : T.camBtn;
  document.getElementById('lbl-or').textContent = T.orText;
  document.getElementById('manualCode').placeholder = T.placeholder;
  document.getElementById('lbl-info-box').innerHTML = T.infoBox;
  document.getElementById('lbl-upload-title').textContent = T.uploadTitle;
  document.getElementById('lbl-upload-sub').textContent = T.uploadSub;
  document.getElementById('fileName').textContent = T.defaultFile;
  document.getElementById('fileMeta').textContent = T.defaultMeta;
  document.getElementById('lbl-active').textContent = T.active;
  document.getElementById('searchInput').placeholder = T.searchPlaceholder;
  document.getElementById('lbl-refresh').textContent = T.refresh;
}

function showTab(tab, el){
  document.querySelectorAll('.section').forEach(function(s){s.classList.add('hidden');});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById('tab-'+tab).classList.remove('hidden');
  el.classList.add('active');
  if(tab==='list') renderList(DB);
}

function searchCode(code){
  var q = (code!==undefined?code:document.getElementById('manualCode').value).trim();
  if(!q) return;
  var found = null;
  for(var i=0;i<DB.length;i++){if(DB[i].code===q){found=DB[i];break;}}
  var card = document.getElementById('resultCard');
  card.style.display='block';
  if(found){
    card.className='result-card found';
    document.getElementById('resultIco').textContent='\u2713';
    document.getElementById('resultStatus').textContent=T.found;
    document.getElementById('resultDetail').innerHTML=
      '<div class="result-row"><span class="rkey">'+T.barcode+'</span><span class="rval">'+found.code+'</span></div>'+
      '<div class="result-row"><span class="rkey">'+T.docname+'</span><span class="rval highlight">'+found.name+'</span></div>';
    document.getElementById('openBtnWrap').innerHTML=
      '<button class="btn btn-green" onclick="openPDF(\''+found.url+'\')">'+
      '<i class="ti ti-file-type-pdf"></i> '+T.openPdf+'</button>';
  } else {
    card.className='result-card notfound';
    document.getElementById('resultIco').textContent='\u2717';
    document.getElementById('resultStatus').textContent=T.notfound;
    document.getElementById('resultDetail').innerHTML=
      '<div class="result-row"><span class="rkey">'+T.barcode+'</span><span class="rval">'+q+'</span></div>';
    document.getElementById('openBtnWrap').innerHTML='';
  }
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function openPDF(url){
  if(isIOS){ window.location.href=url; }
  else { window.open(url,'_blank'); }
}

// ── 카메라 (Android / 일반 브라우저) ──
var streamActive=false, scanInterval=null, videoStream=null, torchOn=false, currentZoom=1, codeReader=null;

function buildCamUI(){
  if(document.getElementById('camOverlay')) return;
  var overlay=document.createElement('div');
  overlay.id='camOverlay';
  overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;';
  var v=document.getElementById('videoEl');
  v.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:2;display:block;';
  overlay.appendChild(v);
  // Header
  var hdr=document.createElement('div');
  hdr.style.cssText='position:absolute;top:0;left:0;right:0;padding:44px 16px 14px;background:linear-gradient(to bottom,rgba(0,0,0,0.75),transparent);display:flex;align-items:center;gap:10px;z-index:20;';
  hdr.innerHTML='<i class="ti ti-camera" style="color:#fff;font-size:20px;"></i><span style="color:#fff;font-size:15px;font-weight:600;">'+T.camHeader+'</span>';
  var closeBtn=document.createElement('button');
  closeBtn.style.cssText='margin-left:auto;background:rgba(255,255,255,0.2);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;';
  closeBtn.innerHTML='<i class="ti ti-x"></i>';
  closeBtn.onclick=stopCamera;
  hdr.appendChild(closeBtn);
  overlay.appendChild(hdr);
  // Frame
  var frame=document.createElement('div');
  frame.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:220px;height:220px;z-index:20;';
  frame.innerHTML=
    '<div style="position:absolute;top:0;left:0;width:34px;height:34px;border-top:3px solid #fff;border-left:3px solid #fff;"></div>'+
    '<div style="position:absolute;top:0;right:0;width:34px;height:34px;border-top:3px solid #fff;border-right:3px solid #fff;"></div>'+
    '<div style="position:absolute;bottom:0;left:0;width:34px;height:34px;border-bottom:3px solid #fff;border-left:3px solid #fff;"></div>'+
    '<div style="position:absolute;bottom:0;right:0;width:34px;height:34px;border-bottom:3px solid #fff;border-right:3px solid #fff;"></div>'+
    '<div style="position:absolute;left:0;right:0;height:2px;background:linear-gradient(to right,transparent,rgba(255,80,80,0.95),transparent);animation:csl 2s ease-in-out infinite;"></div>';
  overlay.appendChild(frame);
  // Hint
  var hint=document.createElement('div');
  hint.style.cssText='position:absolute;top:calc(50% + 60px);left:0;right:0;text-align:center;color:rgba(255,255,255,0.8);font-size:12px;z-index:20;transform:translateY(-60%);';
  hint.textContent=T.camHint;
  overlay.appendChild(hint);
  // Buttons
  var btnStyle='flex:1;padding:12px 6px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.5);background:rgba(255,255,255,0.1);color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;';
  var btm=document.createElement('div');
  btm.style.cssText='position:absolute;bottom:0;left:0;right:0;padding:16px 16px 40px;background:linear-gradient(to top,rgba(0,0,0,0.85) 60%,transparent);z-index:20;display:flex;gap:10px;';

function startCamera(){
  // iOS: 실시간 카메라 스트림 스캔
  if(isIOS){
    startIOSCamera();
    return;
  }
  // Android
  buildCamUI();
  navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}
  }).then(function(stream){
    videoStream=stream;
    var track=stream.getVideoTracks()[0];
    if(track&&track.applyConstraints){
      track.applyConstraints({advanced:[{focusMode:'continuous'},{exposureMode:'continuous'}]}).catch(function(){});
    }
    var v=document.getElementById('videoEl');
    v.srcObject=stream;
    v.play().then(function(){
      streamActive=true;
      setTimeout(function(){startScanning(v);},800);
    });
  }).catch(function(err){
    stopCamera();
    alert(T.camErr);
  });
}

function startScanning(v){
  if('BarcodeDetector' in window){
    var detector=new BarcodeDetector({formats:['qr_code','code_39','code_128','ean_13','ean_8','upc_a','upc_e','itf','data_matrix','codabar','code_93']});
    function detect(){
      if(!streamActive) return;
      detector.detect(v).then(function(barcodes){
        if(barcodes.length>0&&streamActive){
          streamActive=false;
          var code=barcodes[0].rawValue;
          if(navigator.vibrate) navigator.vibrate([100,50,100]);
          stopCamera();
          document.getElementById('manualCode').value=code;
          searchCode(code);
        } else { if(streamActive) scanInterval=setTimeout(detect,150); }
      }).catch(function(){if(streamActive) scanInterval=setTimeout(detect,150);});
    }
    detect(); return;
  }
  // ZXing fallback
  if(typeof ZXing==='undefined'){setTimeout(function(){startScanning(v);},300);return;}
  var hints=new Map();
  hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
    ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,
    ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,
    ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.ITF,ZXing.BarcodeFormat.CODABAR,
    ZXing.BarcodeFormat.CODE_93,ZXing.BarcodeFormat.DATA_MATRIX
  ]);
  var reader=new ZXing.MultiFormatReader();
  reader.setHints(hints);
  var canvas=document.createElement('canvas');
  var ctx=canvas.getContext('2d');
  function scan(){
    if(!streamActive) return;
    if(v.readyState<2){scanInterval=setTimeout(scan,100);return;}
    try{
      canvas.width=v.videoWidth;canvas.height=v.videoHeight;
      ctx.drawImage(v,0,0);
      var imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
      var lum=new ZXing.RGBLuminanceSource(imgData.data,canvas.width,canvas.height);
      var bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
      var result=reader.decode(bmp);
      if(result&&streamActive){
        streamActive=false;
        var code=result.getText();
        if(navigator.vibrate) navigator.vibrate([100,50,100]);
        stopCamera();
        document.getElementById('manualCode').value=code;
        searchCode(code);
        return;
      }
    }catch(e){}
    if(streamActive) scanInterval=setTimeout(scan,100);
  }
  scan();
}

function stopCamera(){
  streamActive=false; torchOn=false; currentZoom=1;
  if(scanInterval){clearTimeout(scanInterval);scanInterval=null;}
  if(videoStream){videoStream.getTracks().forEach(function(t){t.stop();});videoStream=null;}
  var v=document.getElementById('videoEl');
  if(v){v.srcObject=null;v.style.display='none';document.body.appendChild(v);}
  var o=document.getElementById('camOverlay');
  if(o) document.body.removeChild(o);
}

function toggleTorch(){
  if(!videoStream) return;
  var t=videoStream.getVideoTracks()[0];
  if(!t) return;
  torchOn=!torchOn;
  t.applyConstraints({advanced:[{torch:torchOn}]}).catch(function(){
    var btn=document.getElementById('torchBtn');
    if(btn) btn.innerHTML='<i class="ti ti-flashlight-off"></i> \uc9c0\uc6d0\uc548\ub428';
    torchOn=false;
  });
  var btn=document.getElementById('torchBtn');
  if(btn) btn.innerHTML=torchOn?'<i class="ti ti-flashlight"></i> ON':'<i class="ti ti-flashlight"></i> \ud50c\ub798\uc2dc';
}

function setZoom(z){
  currentZoom=z;
  if(videoStream){
    var t=videoStream.getVideoTracks()[0];
    if(t) t.applyConstraints({advanced:[{zoom:z}]}).catch(function(){});
  }
  [1,1.5,2].forEach(function(zv){
    var btn=document.getElementById('zoomBtn'+zv);
    if(!btn) return;
    btn.style.background=(zv===z)?'rgba(255,255,255,0.4)':'rgba(255,255,255,0.1)';
    btn.style.border=(zv===z)?'2px solid #fff':'1.5px solid rgba(255,255,255,0.5)';
    btn.style.fontWeight=(zv===z)?'700':'500';
  });
}

function startIOSScan(vid){
  if(!iosActive) return;
  if(typeof ZXing==='undefined'){setTimeout(function(){startIOSScan(vid);},300);return;}

  var hints=new Map();
  hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
    ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,
    ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,
    ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.ITF,ZXing.BarcodeFormat.CODABAR,
    ZXing.BarcodeFormat.CODE_93,ZXing.BarcodeFormat.DATA_MATRIX
  ]);
  var reader=new ZXing.MultiFormatReader();
  reader.setHints(hints);
  var canvas=document.createElement('canvas');
  var ctx=canvas.getContext('2d');

  function scan(){
    if(!iosActive) return;
    if(!vid.videoWidth||vid.readyState<2){iosScanInterval=setTimeout(scan,200);return;}
    var vw=vid.videoWidth, vh=vid.videoHeight;
    canvas.width=vw; canvas.height=vh;
    ctx.drawImage(vid,0,0,vw,vh);
    var decoded=null;
    // 전체 → 중앙 80% → 수평띠 순으로 시도
    var regions=[
      [0,0,vw,vh],
      [vw*0.1,vh*0.1,vw*0.8,vh*0.8],
      [0,vh*0.25,vw,vh*0.5]
    ];
    for(var ri=0;ri<regions.length&&!decoded;ri++){
      var r=regions[ri];
      var cw2=Math.floor(r[2]),ch2=Math.floor(r[3]);
      if(cw2<10||ch2<10) continue;
      var c2=document.createElement('canvas');
      c2.width=cw2;c2.height=ch2;
      var cx2=c2.getContext('2d');
      cx2.drawImage(vid,Math.floor(r[0]),Math.floor(r[1]),cw2,ch2,0,0,cw2,ch2);
      try{
        var imgData=cx2.getImageData(0,0,cw2,ch2);
        var lum=new ZXing.RGBLuminanceSource(imgData.data,cw2,ch2);
        var bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
        var result=reader.decode(bmp);
        if(result) decoded=result.getText();
      }catch(e){}
    }
    if(decoded&&iosActive){
      iosActive=false;
      stopIOSCamera();
      document.getElementById('manualCode').value=decoded;
      searchCode(decoded);
      return;
    }
    if(iosActive) iosScanInterval=setTimeout(scan,150);
  }
  scan();
}

function stopIOSCamera(){
  iosActive=false;
  if(iosScanInterval){clearTimeout(iosScanInterval);iosScanInterval=null;}
  if(iosStream){iosStream.getTracks().forEach(function(t){t.stop();});iosStream=null;}
  var o=document.getElementById('iosCamOverlay');
  if(o) document.body.removeChild(o);
}

// ── 데이터 로드 ──
function loadXLSX(){
  var statusEl=document.getElementById('loadStatus');
  if(statusEl) statusEl.textContent=T.loading;
  fetch(XLSX_URL+'?t='+Date.now())
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer();})
    .then(function(buf){
      var wb=XLSX.read(buf,{type:'array',raw:false});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
      var newDB=[];
      for(var i=1;i<rows.length;i++){
        var row=rows[i];
        var rawCode=row[0];
        if(rawCode===undefined||rawCode===null||rawCode==='') continue;
        var code='';
        if(typeof rawCode==='number'){
          var cellAddr=XLSX.utils.encode_cell({r:i,c:0});
          var cell=ws[cellAddr];
          if(cell&&cell.w){code=cell.w.replace(/,/g,'').trim();}
          else{try{code=BigInt(rawCode).toString();}catch(ex){code=Math.round(rawCode).toString();}}
        } else {code=rawCode.toString().trim();}
        if(!code) continue;
        var name=(row[1]||'').toString().trim();
        var url=(row[2]||'').toString().trim();
        if(!url) continue;
        newDB.push({code:code,name:name,url:url});
      }
      if(newDB.length>0){
        DB=newDB;
        if(statusEl) statusEl.textContent='\u2713 '+DB.length+T.loadOk;
        document.getElementById('fileMeta').textContent=DB.length+T.count+' \u00b7 '+T.active;
        document.getElementById('docCount').textContent=T.total+DB.length+T.count;
        renderList(DB);
      } else {
        if(statusEl) statusEl.textContent='\ub370\uc774\ud130\uac00 \ube44\uc5b4\uc788\uc2b5\ub2c8\ub2e4.';
      }
    }).catch(function(e){if(statusEl) statusEl.textContent=T.loadFail+e.message;});
}

function handleFile(input){
  var file=input.files[0];
  if(!file) return;
  document.getElementById('fileName').textContent=file.name;
  var statusEl=document.getElementById('loadStatus');
  if(statusEl) statusEl.textContent='\ud30c\uc77c \uc77d\ub294 \uc911...';
  var reader2=new FileReader();
  reader2.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array',raw:true});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
      var newDB=[];
      for(var i=1;i<rows.length;i++){
        var row=rows[i];
        var rawCode=row[0];
        if(!rawCode&&rawCode!==0) continue;
        var code='';
        if(typeof rawCode==='number'){
          var cellAddr=XLSX.utils.encode_cell({r:i,c:0});
          var cell=ws[cellAddr];
          if(cell&&cell.w){code=cell.w.replace(/,/g,'').trim();}
          else{try{code=BigInt(rawCode).toString();}catch(ex){code=Math.round(rawCode).toString();}}
        } else {code=rawCode.toString().trim();}
        var name=(row[1]||'').toString().trim();
        var url=(row[2]||'').toString().trim();
        if(!code||!url) continue;
        newDB.push({code:code,name:name,url:url});
      }
      if(newDB.length>0){
        DB=newDB;
        if(statusEl) statusEl.textContent='\u2713 '+DB.length+T.loadOk;
        document.getElementById('fileMeta').textContent=DB.length+T.count+' \u00b7 '+T.active;
        renderList(DB);
      }
    }catch(ex){if(statusEl) statusEl.textContent=T.loadFail+ex.message;}
  };
  reader2.readAsArrayBuffer(file);
}

function renderList(data){
  document.getElementById('docCount').textContent=T.total+data.length+T.count;
  var el=document.getElementById('docList');
  if(!data.length){el.innerHTML='<div class="empty">'+T.noResult+'</div>';return;}
  var html='';
  for(var i=0;i<data.length;i++){
    var d=data[i];
    html+='<div class="doc-row" onclick="goScan(\''+d.code+'\')">'+
      '<div class="doc-icon"><i class="ti ti-file-type-pdf"></i></div>'+
      '<div class="doc-info"><p class="doc-name">'+d.name+'</p><p class="doc-code">'+d.code+'</p></div>'+
      '<i class="ti ti-chevron-right" style="color:#90caf9;font-size:16px;flex-shrink:0;"></i></div>';
  }
  el.innerHTML=html;
}

function filterList(q){
  var filtered=q?DB.filter(function(d){return d.name.indexOf(q)>=0||d.code.indexOf(q)>=0;}):DB;
  renderList(filtered);
}

function goScan(code){
  showTab('scan',document.getElementById('tab-btn-scan'));
  document.getElementById('manualCode').value=code;
  searchCode(code);
}

initLabels();
loadXLSX();
</script>
