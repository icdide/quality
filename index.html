<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f4f8;overscroll-behavior:none;}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,0.12);}
.hero{position:relative;background:linear-gradient(145deg,#0a2e6e 0%,#1255b5 45%,#1976d2 70%,#64b5f6 100%);padding:28px 20px 30px;text-align:center;overflow:hidden;flex-shrink:0;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 75% 25%,rgba(255,255,255,0.18) 0%,transparent 55%);}
.cloud{position:absolute;background:rgba(255,255,255,0.15);border-radius:60px;}
.cloud1{width:130px;height:32px;top:18%;left:-15px;filter:blur(6px);}
.cloud2{width:100px;height:26px;top:55%;right:-5px;filter:blur(5px);}
.cloud3{width:80px;height:20px;top:75%;left:55%;filter:blur(4px);}
.hero-inner{position:relative;z-index:2;}
.logo-text{font-size:32px;font-weight:800;color:#fff;letter-spacing:3px;text-shadow:0 2px 12px rgba(0,0,0,0.35);}
.logo-sub{font-size:10px;color:rgba(255,255,255,0.8);letter-spacing:3.5px;font-weight:500;margin-bottom:14px;margin-top:4px;}
.hero-title{font-size:19px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.4);margin-bottom:5px;}
.hero-since{font-size:10px;color:rgba(255,255,255,0.65);letter-spacing:2.5px;}
.tab-bar{display:flex;border-bottom:2px solid #1255b5;background:#fff;flex-shrink:0;}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:13px;color:#888;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:500;}
.tab.active{color:#1255b5;border-bottom:3px solid #1255b5;font-weight:700;}
.tab i{font-size:14px;vertical-align:-2px;margin-right:3px;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.section{padding:16px;}
.section.hidden{display:none;}
.scan-area{border-radius:16px;padding:24px 16px;text-align:center;margin-bottom:14px;background:linear-gradient(145deg,#e3f2fd,#bbdefb);border:1px solid #90caf9;position:relative;overflow:hidden;}
.scan-frame{width:150px;height:150px;margin:0 auto 14px;position:relative;}
.corner{position:absolute;width:28px;height:28px;border-color:#1255b5;border-style:solid;}
.c-tl{top:0;left:0;border-width:3px 0 0 3px;}
.c-tr{top:0;right:0;border-width:3px 3px 0 0;}
.c-bl{bottom:0;left:0;border-width:0 0 3px 3px;}
.c-br{bottom:0;right:0;border-width:0 3px 3px 0;}
.frame-inner{position:absolute;inset:22px;display:flex;align-items:center;justify-content:center;}
.scan-line{position:absolute;left:6px;right:6px;height:2px;background:linear-gradient(to right,transparent,#1255b5 30%,#1976d2,#1255b5 70%,transparent);animation:sl 2s ease-in-out infinite;}
@keyframes sl{0%,100%{top:8px;opacity:0.4;}50%{top:136px;opacity:1;}}
.btn{width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:none;margin-bottom:10px;-webkit-appearance:none;}
.btn-primary{background:linear-gradient(135deg,#0d47a1,#1565c0,#1976d2);color:#fff;}
.btn-green{background:linear-gradient(135deg,#1B6B4A,#1D9E75);color:#fff;}
.btn-outline{background:#fff;color:#1255b5;border:1.5px solid #90caf9;}
.divider{font-size:11px;color:#aaa;text-align:center;margin:10px 0;position:relative;}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:0.5px;background:#dde;}
.divider::before{left:0;}.divider::after{right:0;}
.manual-row{display:flex;gap:8px;margin-bottom:14px;}
.manual-row input{flex:1;padding:12px 14px;border-radius:10px;border:1.5px solid #90caf9;font-size:14px;background:#f5faff;color:#111;outline:none;font-family:inherit;}
.manual-row button{padding:12px 16px;border-radius:10px;background:linear-gradient(135deg,#1255b5,#1976d2);color:#fff;border:none;cursor:pointer;font-size:15px;}
.result-card{border-radius:14px;padding:14px;margin-top:2px;display:none;}
.result-card.found{background:#e8f5e9;border:1px solid #a5d6a7;}
.result-card.notfound{background:#ffebee;border:1px solid #ef9a9a;}
.result-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.result-ico{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.found .result-ico{background:#2e7d32;color:#fff;}
.notfound .result-ico{background:#c62828;color:#fff;}
.result-status{font-size:13px;font-weight:700;}
.found .result-status{color:#2e7d32;}
.notfound .result-status{color:#c62828;}
.result-detail{background:rgba(255,255,255,0.65);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.result-row{display:flex;align-items:flex-start;margin-bottom:5px;}
.rkey{font-size:11px;color:#888;width:60px;flex-shrink:0;padding-top:2px;}
.rval{font-size:13px;font-weight:600;color:#111;word-break:break-all;}
.rval.highlight{color:#1255b5;font-size:14px;}
.info-box{background:#e3f2fd;border-radius:10px;padding:13px;margin-bottom:13px;font-size:13px;color:#0d47a1;line-height:1.8;border:1px solid #90caf9;}
.upload-zone{border:2px dashed #90caf9;border-radius:14px;padding:26px 16px;text-align:center;background:#f0f8ff;margin-bottom:13px;cursor:pointer;}
.file-row{display:flex;align-items:center;gap:11px;padding:12px 14px;background:#f5faff;border-radius:10px;border:1px solid #90caf9;}
.file-info{flex:1;}
.file-name{font-size:13px;font-weight:600;color:#111;}
.file-meta{font-size:11px;color:#888;margin-top:2px;}
.badge{font-size:10px;padding:3px 9px;border-radius:99px;font-weight:600;}
.badge-green{background:#2e7d32;color:#fff;}
.search-wrap{position:relative;margin-bottom:12px;}
.search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:#90caf9;}
.search-input{width:100%;padding:11px 12px 11px 36px;border-radius:10px;border:1.5px solid #90caf9;font-size:14px;background:#f5faff;color:#111;outline:none;font-family:inherit;}
.doc-count{font-size:12px;color:#888;margin-bottom:10px;}
.doc-row{display:flex;align-items:center;gap:11px;padding:13px 14px;background:#fff;border-radius:12px;border:1px solid #e3f2fd;margin-bottom:8px;cursor:pointer;}
.doc-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#ffebee,#ffcdd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.doc-icon i{font-size:22px;color:#c62828;}
.doc-info{flex:1;min-width:0;}
.doc-name{font-size:14px;font-weight:600;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc-code{font-size:11px;color:#888;margin-top:2px;font-family:monospace;}
.empty{text-align:center;padding:32px 20px;color:#aaa;font-size:14px;}
#cameraSection{display:none;position:fixed;inset:0;background:#000;z-index:100;flex-direction:column;}
#cameraSection.active{display:flex;}
#videoEl{width:100%;flex:1;object-fit:cover;}
.cam-header{padding:48px 20px 16px;background:rgba(0,0,0,0.6);display:flex;align-items:center;gap:12px;flex-shrink:0;}
.cam-header span{color:#fff;font-size:16px;font-weight:600;}
.cam-close{background:rgba(255,255,255,0.2);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-left:auto;}
.cam-overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;}
.cam-frame{width:220px;height:220px;position:relative;}
.cam-corner{position:absolute;width:36px;height:36px;border-color:#fff;border-style:solid;}
.cam-corner.tl{top:0;left:0;border-width:3px 0 0 3px;}
.cam-corner.tr{top:0;right:0;border-width:3px 3px 0 0;}
.cam-corner.bl{bottom:0;left:0;border-width:0 0 3px 3px;}
.cam-corner.br{bottom:0;right:0;border-width:0 3px 3px 0;}
.cam-scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(to right,transparent,rgba(255,80,80,0.9),transparent);animation:csl 2s ease-in-out infinite;}
@keyframes csl{0%,100%{top:0;opacity:0.5;}50%{top:218px;opacity:1;}}
.cam-hint{position:absolute;bottom:100px;left:0;right:0;text-align:center;color:rgba(255,255,255,0.85);font-size:13px;}
.cam-bottom{padding:20px;background:rgba(0,0,0,0.7);flex-shrink:0;}
</style>

<body>

  <div class="hero">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="hero-inner">
      <div class="logo-text">EHWA&#174;</div>

  <div class="tab-bar">

    <div id="tab-upload" class="section hidden">

      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <i class="ti ti-table-import" style="font-size:34px;color:#1255b5;display:block;margin-bottom:8px;"></i>
        <p style="font-size:15px;font-weight:700;color:#0a2e6e;margin-bottom:4px;" id="lbl-upload-title"></p>
        <p style="font-size:12px;color:#1565c0;" id="lbl-upload-sub"></p>
      </div>

      </div>
      <div style="margin-top:10px;padding:10px 12px;background:#e3f2fd;border-radius:8px;border:1px solid #90caf9;display:flex;align-items:center;gap:8px;">
        <i class="ti ti-cloud-download" style="font-size:16px;color:#1255b5;flex-shrink:0;"></i>
        <span style="font-size:12px;color:#0d47a1;flex:1;" id="loadStatus">데이터 불러오는 중...</span>
        <button onclick="loadCSV()" style="padding:5px 10px;background:#1255b5;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;">새로고침</button>
      </div>
      <div style="margin-top:10px;padding:10px 12px;background:#e3f2fd;border-radius:8px;border:1px solid #90caf9;display:flex;align-items:center;gap:8px;">
        <i class="ti ti-cloud-download" style="font-size:16px;color:#1255b5;flex-shrink:0;"></i>
        <span style="font-size:12px;color:#0d47a1;" id="loadStatus"></span>
        <button onclick="loadCSV()" style="margin-left:auto;padding:5px 10px;background:#1255b5;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;">새로고침</button>
      </div>
    </div>
    <div id="tab-list" class="section hidden">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input class="search-input" id="searchInput" type="text" oninput="filterList(this.value)">
      </div>
      <p class="doc-count" id="docCount"></p>
      <div id="docList"></div>
    </div>
  </div>
</div>
<div id="cameraSection">

    <i class="ti ti-camera" style="color:#fff;font-size:20px;"></i>

    <button class="cam-close" onclick="stopCamera()"><i class="ti ti-x"></i></button>

  </div>
</div>

var DB = [];
var XLSX_URL = 'https://raw.githubusercontent.com/icdide/quality/main/data.xlsx';

function loadCSV() {
  loadXLSX();
}

function loadXLSX() {
  var statusEl = document.getElementById('loadStatus');
  if(statusEl) statusEl.textContent = '데이터 불러오는 중...';
  fetch(XLSX_URL + '?t=' + Date.now())
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.arrayBuffer();
    })
    .then(function(buf){
      var wb = XLSX.read(buf, {type:'array', cellText:false, cellDates:true, raw:false});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
      var newDB = [];
      for(var i=1; i<rows.length; i++){
        var row = rows[i];
        var code = (row[0]||'').toString().trim();
        var name = (row[1]||'').toString().trim();
        var url  = (row[2]||'').toString().trim();
        if(code && url){
          // 지수표현(1.23E+13) 방지: 이미 raw:false로 읽으므로 숫자형이면 정수변환
          if(/^\d+\.?\d*[eE][+\-]?\d+$/.test(code)){
            try{ code = BigInt(Math.round(parseFloat(code))).toString(); }catch(e){}
          }
          newDB.push({code:code, name:name, url:url});
        }
      }
      if(newDB.length > 0){
        DB = newDB;
        var metaEl = document.getElementById('fileMeta');
        var countEl = document.getElementById('docCount');
        if(metaEl) metaEl.textContent = DB.length + '개 항목 · 활성';
        if(countEl) countEl.textContent = '전체 ' + DB.length + '개';
        if(statusEl) statusEl.textContent = '✓ ' + DB.length + '개 항목 로드 완료';
        renderList(DB);
      } else {
        if(statusEl) statusEl.textContent = '데이터가 비어있습니다. 파일을 확인해주세요.';
      }
    })
    .catch(function(e){
      if(statusEl) statusEl.textContent = '로드 실패: ' + e.message;
      console.error(e);
    });
}

var codeReader = null;
var streamActive = false;

function showTab(tab, el) {
  document.querySelectorAll('.section').forEach(function(s){s.classList.add('hidden');});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById('tab-'+tab).classList.remove('hidden');
  el.classList.add('active');
  if(tab==='list') renderList(DB);
}

function searchCode(code) {
  var q = (code !== undefined ? code : document.getElementById('manualCode').value).trim();
  if(!q) return;
  var found = null;
  for(var i=0;i<DB.length;i++){if(DB[i].code===q){found=DB[i];break;}}
  var card = document.getElementById('resultCard');
  card.style.display='block';
  if(found){
    card.className='result-card found';
    document.getElementById('resultIco').textContent='\u2713';
    document.getElementById('resultStatus').textContent=T.found;
    document.getElementById('resultDetail').innerHTML=
      '<div class="result-row"><span class="rkey">'+T.barcode+'</span><span class="rval">'+found.code+'</span></div>'+
      '<div class="result-row"><span class="rkey">'+T.docname+'</span><span class="rval highlight">'+found.name+'</span></div>';
    document.getElementById('openBtnWrap').innerHTML=
      '<button class="btn btn-green" onclick="openPDF(\''+found.url+'\')">'+
      '<i class="ti ti-file-type-pdf"></i> '+T.openPdf+'</button>';
  } else {
    card.className='result-card notfound';
    document.getElementById('resultIco').textContent='\u2717';
    document.getElementById('resultStatus').textContent=T.notfound;
    document.getElementById('resultDetail').innerHTML=
      '<div class="result-row"><span class="rkey">'+T.barcode+'</span><span class="rval">'+q+'</span></div>';
    document.getElementById('openBtnWrap').innerHTML='';
  }
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function openPDF(url){window.open(url,'_blank');}

function startCamera(){
  var camEl=document.getElementById('cameraSection');
  camEl.classList.add('active');
  navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}
  }).then(function(stream){
    var v=document.getElementById('videoEl');
    v.srcObject=stream;
    v.play();
    streamActive=true;
    waitForZXing(stream);
  }).catch(function(err){
    camEl.classList.remove('active');
    alert(err.name==='NotFoundError'?T.camError2:T.camError1);
  });
}

function waitForZXing(stream){
  if(typeof ZXing==='undefined'){setTimeout(function(){waitForZXing(stream);},300);return;}
  try{
    var hints = new Map();
    var formats = [
      ZXing.BarcodeFormat.QR_CODE,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.DATA_MATRIX,
      ZXing.BarcodeFormat.CODABAR,
      ZXing.BarcodeFormat.CODE_93
    ];
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    codeReader = new ZXing.BrowserMultiFormatReader(hints);
    var v=document.getElementById('videoEl');
    codeReader.decodeFromStream(stream,v,function(result,err){
      if(result&&streamActive){
        streamActive=false;
        var code=result.getText();
        var fmt=result.getBarcodeFormat?result.getBarcodeFormat().toString():'';
        stopCamera();
        document.getElementById('manualCode').value=code;
        searchCode(code);
        if(navigator.vibrate)navigator.vibrate([100,50,100]);
      }
    });
  }catch(e){console.error(e);}
}

function stopCamera(){
  streamActive=false;
  if(codeReader){try{codeReader.reset();}catch(e){}codeReader=null;}
  var v=document.getElementById('videoEl');
  if(v&&v.srcObject){v.srcObject.getTracks().forEach(function(t){t.stop();});v.srcObject=null;}
  document.getElementById('cameraSection').classList.remove('active');
}

function handleFile(input){
  var file=input.files[0];
  if(!file)return;
  document.getElementById('fileName').textContent=file.name;
  if(file.name.toLowerCase().endsWith('.csv')){
    var reader=new FileReader();
    reader.onload=function(e){
      var lines=e.target.result.split('\n').filter(function(l){return l.trim();});
      var newDB=[];
      for(var i=1;i<lines.length;i++){
        var parts=lines[i].split(',');
        if(parts.length>=3&&parts[0].trim()&&parts[2].trim())
          newDB.push({code:parts[0].trim(),name:(parts[1]||'').trim(),url:parts[2].trim()});
      }
      if(newDB.length>0){
        DB=newDB;
        document.getElementById('fileMeta').textContent=DB.length+T.count+' \u00b7 '+T.active;
        alert(DB.length+T.loaded);
      }
    };
    reader.readAsText(file,'UTF-8');
  } else {
    alert(T.xlsxMsg);
  }
}

function renderList(data){
  document.getElementById('docCount').textContent=T.total+data.length+T.count;
  var el=document.getElementById('docList');
  if(!data.length){el.innerHTML='<div class="empty">'+T.noResult+'</div>';return;}
  var html='';
  for(var i=0;i<data.length;i++){
    var d=data[i];
    html+='<div class="doc-row" onclick="goScan(\''+d.code+'\')">'+
      '<div class="doc-icon"><i class="ti ti-file-type-pdf"></i></div>'+
      '<div class="doc-info"><p class="doc-name">'+d.name+'</p><p class="doc-code">'+d.code+'</p></div>'+
      '<i class="ti ti-chevron-right" style="color:#90caf9;font-size:16px;flex-shrink:0;"></i></div>';
  }
  el.innerHTML=html;
}

function filterList(q){
  var filtered=q?DB.filter(function(d){return d.name.indexOf(q)>=0||d.code.indexOf(q)>=0;}):DB;
  renderList(filtered);
}

function goScan(code){
  showTab('scan',document.getElementById('tab-btn-scan'));
  document.getElementById('manualCode').value=code;
  searchCode(code);
}

initLabels();
loadCSV();
</script>
</body>
